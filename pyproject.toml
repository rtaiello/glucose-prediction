[project]
name = "glucose-prediction"
version = "0.0.1"
description = "Glucose prediction using Replace-BG Dataset"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Riccardo Taiello", email = "taiello.riccardo@gmail.com" },
]
keywords = ["python", "glucose", "prediction", "deep-learning"]
requires-python = ">=3.10,<3.13"
dependencies = [
"lightning>=2.0,<3.0",
    "torch>=2.0",
    "torchvision",
    "torchmetrics>=1.0,<2.0",
    "hydra-core>=1.3,<2.0",
    "wandb",
    "streamlit",
    "rich",
    "dvc",
    "python-dotenv",
    "matplotlib",
    "stqdm",
    "pandas",
    "numpy",
    "setuptools<81",
]

[project.optional-dependencies]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mike",
]
test = [
    "pytest",
    "pytest-cov",
]
dev = [
    "glucose-prediction[test,docs]",
    "black",
    "flake8",
    "isort",
    "pre-commit",
    "bandit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glucose_prediction"]

[tool.pytest.ini_options]
minversion = "6.2"
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.report]
exclude_lines = [
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "pragma: nocover",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 120
include = '\.pyi?$'

[tool.mypy]
files = ["src/**/*.py", "test/*.py"]
ignore_missing_imports = true

[tool.isort]
profile = 'black'
line_length = 120
known_third_party = ["numpy", "pytest", "wandb", "torch"]
known_first_party = []
known_local_folder = "glucose_prediction"

[tool.pydocstyle]
convention = 'google'
add-ignore = ['D100', 'D101', 'D102', 'D103', 'D104', 'D105', 'D106', 'D107']

[tool.bandit]
skips = ["B101"]
