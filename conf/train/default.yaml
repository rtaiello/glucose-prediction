# reproducibility
seed_index: 0
deterministic: False

# PyTorch Lightning Trainer https://pytorch-lightning.readthedocs.io/en/stable/common/trainer.html
trainer:
  fast_dev_run: True # Enable this for debug purposes
  accelerator: 'gpu'
  devices: 1
  precision: 32
  max_epochs: 5
  num_sanity_val_steps: 2
  gradient_clip_val: 10.0
  val_check_interval: 1.0
  deterministic: ${train.deterministic}

monitor:
  metric: 'loss/val'
  mode: 'min'

callbacks:
  - _target_: lightning.pytorch.callbacks.EarlyStopping
    patience: 42
    verbose: False
    monitor: ${train.monitor.metric}
    mode: ${train.monitor.mode}

  - _target_: lightning.pytorch.callbacks.ModelCheckpoint
    save_top_k: 1
    verbose: False
    monitor: ${train.monitor.metric}
    mode: ${train.monitor.mode}

  - _target_: lightning.pytorch.callbacks.LearningRateMonitor
    logging_interval: "step"
    log_momentum: False

  - _target_: lightning.pytorch.callbacks.progress.tqdm_progress.TQDMProgressBar
    refresh_rate: 20

logging:
  # Set to null to disable external logging (default).
  # Override with: train.logging.logger=wandb to enable W&B.
  logger: null

  wandb:
    _target_: lightning.pytorch.loggers.WandbLogger
    project: ${core.project_name}
    entity: null
    log_model: true
    mode: 'online'
    tags: ${core.tags}

  csv:
    _target_: lightning.pytorch.loggers.CSVLogger
    save_dir: ${core.storage_dir}
    name: ${core.project_name}
